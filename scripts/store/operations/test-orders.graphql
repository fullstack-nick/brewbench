query TestOrders {
  orders(first: 5, sortKey: CREATED_AT, reverse: true, query: "test:true") {
    nodes {
      id
      name
      test
      displayFinancialStatus
      currentTotalPriceSet {
        shopMoney {
          amount
          currencyCode
        }
      }
      shippingAddress {
        countryCodeV2
      }
      shippingLines(first: 5) {
        nodes {
          title
          originalPriceSet {
            shopMoney {
              amount
              currencyCode
            }
          }
        }
      }
      lineItems(first: 10) {
        nodes {
          sku
          quantity
          originalUnitPriceSet {
            shopMoney {
              amount
              currencyCode
            }
          }
        }
      }
    }
  }
}
